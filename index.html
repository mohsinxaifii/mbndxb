  <script>
    // Decide before first paint whether the intro plays, so there is no flash of the page under it.
    (function () {
      var d = document.documentElement, seen
      try { seen = sessionStorage.getItem('intro') } catch (e) {}
      if (!seen && !matchMedia('(prefers-reduced-motion: reduce)').matches && location.pathname.replace(/\/+$/, '').split('/').length <= 2) d.classList.add('intro')
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    })()
  </script>
